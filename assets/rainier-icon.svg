<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rainier mountain icon</title>
  <desc id="desc">A geometric snowcapped mountain with evergreen trees.</desc>

  <defs>
    <linearGradient id="mountain" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#268DD1" />
      <stop offset="1" stop-color="#123C69" />
    </linearGradient>
    <linearGradient id="evergreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123C69" />
      <stop offset="1" stop-color="#14704F" />
    </linearGradient>
    <path id="pine" d="M0 58 18 30h-8L25 8h-8L32-18 55 8h-8l15 22h-8l18 28z" />
  </defs>

  <g transform="translate(0 -70)">
