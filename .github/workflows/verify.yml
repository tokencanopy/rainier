name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Static checks, tests, build, and vet
        run: make verify
      - name: Non-root jail ownership regression
        run: |
          go test -c -o /tmp/rainier-driver-ownership.test ./internal/driver
          sudo env RAINIER_MICROVM_KVM_TEST=1 /tmp/rainier-driver-ownership.test \
            -test.run '^TestMicrovmJailOwnershipWithoutFownerOnLinux$' -test.v
      - name: CLI and client race checks
        run: go test -race -count=1 ./cmd/rainier/ ./internal/cli/
      - name: Fleet script syntax
        run: bash -n scripts/e2e-fleet.sh
